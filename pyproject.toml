[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-agent"
version = "0+aa.2"
description = "Local Telegram conversation agent with feedback and dataset export tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0.0",
  "python-telegram-bot>=22.8,<23",
  "telethon>=1.0.0",
]

[project.optional-dependencies]
local-inference = []
training = []
benchmark = []

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "pyright>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conversation_agent.local_slm" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.conversation-agent]
cup-version = "AA.2"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
