<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation Agent Review</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CONVERSATION AGENT</p>
      <h1>Blind review</h1>
    </div>
    <div class="progress-block">
      <span id="progressText">0 / 0</span>
      <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
    </div>
    <label class="toggle">
      <input id="unreviewedOnly" type="checkbox" checked>
      <span>Только неоценённые</span>
    </label>
  </header>

  <main id="workspace" hidden>
    <section class="scenario-band">
      <div class="scenario-meta">
        <span id="scenarioPosition"></span>
        <strong id="scenarioId"></strong>
        <span id="category"></span>
      </div>
      <div class="context-grid">
        <div>
          <h2>Диалог</h2>
          <div id="conversation" class="conversation"></div>
        </div>
        <dl class="facts">
          <div><dt>Контакт</dt><dd id="relationship"></dd></div>
          <div><dt>Известно</dt><dd id="knownFacts"></dd></div>
          <div><dt>Ограничения</dt><dd id="restrictions"></dd></div>
        </dl>
      </div>
    </section>

    <section class="candidates">
      <article class="candidate candidate-a">
        <div class="candidate-heading">
          <h2>Ответ A</h2>
          <span id="actionA"></span>
        </div>
        <div id="messagesA" class="messages"></div>
        <div class="preset-row" data-candidate="A">
          <button type="button" data-preset="1">Всё плохо</button>
          <button type="button" data-preset="3">В целом нормально</button>
          <button type="button" data-preset="5">Всё хорошо</button>
        </div>
      </article>
      <article class="candidate candidate-b">
        <div class="candidate-heading">
          <h2>Ответ B</h2>
          <span id="actionB"></span>
        </div>
        <div id="messagesB" class="messages"></div>
        <div class="preset-row" data-candidate="B">
          <button type="button" data-preset="1">Всё плохо</button>
          <button type="button" data-preset="3">В целом нормально</button>
          <button type="button" data-preset="5">Всё хорошо</button>
        </div>
      </article>
    </section>

    <section class="evaluation">
      <div class="winner-row">
        <h2>Кто лучше</h2>
        <div id="winnerControl" class="segments winner-segments"></div>
      </div>
      <div class="ratings-header">
        <span>Критерий</span><strong>A</strong><strong>B</strong>
      </div>
      <div id="ratingsGrid" class="ratings-grid"></div>
    </section>
  </main>

  <section id="emptyState" class="empty-state" hidden>
    <h2>Все доступные сценарии оценены</h2>
    <button id="showAllButton" type="button">Показать все</button>
  </section>

  <footer class="toolbar">
    <button id="previousButton" type="button">Назад</button>
    <button id="skipButton" type="button">Пропустить</button>
    <span id="saveStatus" role="status"></span>
    <button id="saveButton" class="primary" type="button" disabled>Сохранить и дальше</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
